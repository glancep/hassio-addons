name: "Jotty"
description: "Lightweight self-hosted app for managing your personal checklists and notes. File-based storage, no database required."
version: "1.23.0"
slug: "jotty"
homeassistant_api: false
auth_api: false
url: "https://jotty.page/"

arch:
  - amd64
  - aarch64

startup: application
boot: auto

ports:
  1122/tcp: 3000
ports_description:
  1122/tcp: "Jotty Web UI"

ingress: true
ingress_port: 3000
panel_icon: "mdi:note-text-outline"
panel_title: "Jotty"

map:
  - type: data
    path: /data

options:
  node_env: "production"
  stop_check_updates: false
  serve_public_images: true
  serve_public_files: true
  app_url: ""
  auth_mode: ""
  oidc_issuer: ""
  oidc_client_id: ""
  oidc_client_secret: ""
  sso_fallback_local: true

schema:
  node_env: "str"
  stop_check_updates: "bool"
  serve_public_images: "bool"
  serve_public_files: "bool"
  app_url: "str?"
  auth_mode: "str?"
  oidc_issuer: "str?"
  oidc_client_id: "str?"
  oidc_client_secret: "str?"
  sso_fallback_local: "bool"
